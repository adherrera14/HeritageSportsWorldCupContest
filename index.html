<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heritage Sports - 2026 World Cup Contest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="text-white">
    <header class="site-sticky-header" role="banner">
        <div class="site-sticky-header-inner">Heritage Sports World Cup Challenge</div>
    </header>
    <div id="app" class="pb-8">
        <!-- Main Content Area -->
        <div class="max-w-md md:max-w-3xl lg:max-w-6xl mx-auto px-4 pt-4">
            <!-- Home Section -->
            <section id="home-section" class="section-content hidden">
                <h2 id="dashboard-title" class="text-2xl font-bold mb-4">2026 FIFA World Cup</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <!-- Tournament Stage Card -->
                    <div class="bg-gray-800 rounded-lg p-4 border border-gray-700">
                        <p class="text-gray-400 text-sm mb-2">Current Stage</p>
                        <p class="text-xl font-bold" id="currentStage">Pre-Tournament</p>
                    </div>

                    <!-- User Score Card -->
                    <div id="home-score-card" class="bg-gradient-to-br from-yellow-600 to-yellow-800 rounded-lg p-6 text-center hidden">
                        <p class="text-sm opacity-90 mb-1">Total Contest Points</p>
                        <p class="text-4xl font-bold" id="userScore">0</p>
                    </div>
                </div>

                <div id="active-phase-section" class="mb-6">
                    <div class="flex items-center justify-between mb-4">
                        <h3 id="active-phase-title" class="font-bold text-xl">Current Phase</h3>
                        <a href="leaderboard.html" class="bg-gray-700 hover:bg-gray-600 text-white text-sm font-semibold px-3 py-2 rounded-lg border border-gray-600">
                            View Leaderboard
                        </a>
                    </div>
                    <div id="active-phase-container"></div>
                </div>
            </section>

            <!-- My Rankings Section -->
            <section id="rankings-section" class="section-content hidden">
                <h2 class="text-2xl font-bold mb-4">Assign Team Rankings</h2>
                
                <!-- Tournament Status -->
                <div id="rankings-status" class="bg-blue-900 text-blue-100 p-3 rounded mb-4 text-sm">
                    <p id="rankings-status-text">🎯 Assign each team a ranking from 48 (best) to 1 (worst)</p>
                </div>

                <!-- Ranking Input Container -->
                <div id="ranking-input-container"></div>

                <!-- Lock Rankings Button -->
                <!-- Submit Button -->
                <button id="submit-rankings-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg mt-4">
                    Lock In My Rankings
                </button>
            </section>

            <!-- Groups Section -->
            <section id="groups-section" class="section-content hidden">
                <h2 class="text-2xl font-bold mb-4">Group Stage Standings</h2>
                <div id="groups-container"></div>
            </section>

            <!-- Knockout Section -->
            <section id="knockout-section" class="section-content hidden">
                <h2 class="text-2xl font-bold mb-4">Knockout Matches</h2>
                <div id="knockout-container"></div>
            </section>

        </div>
    </div>
    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="js/ranking.js"></script>
    <script src="js/groups.js"></script>
    <script src="js/knockout.js"></script>
</body>
</html>
